name: Lean EP absorber

on:
  push:
    paths:
      - "lean/EPAbsorber/**"
      - ".github/workflows/lean-ep-absorber.yml"
  pull_request:
    paths:
      - "lean/EPAbsorber/**"
      - ".github/workflows/lean-ep-absorber.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Lean project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/EPAbsorber
          use-mathlib-cache: true
      - name: Check that every theorem uses only the standard axioms
        working-directory: lean/EPAbsorber
        run: |
          lake env lean scripts/check_axioms.lean | tee axioms.txt
          test "$(grep -c "depends on axioms: \[propext, Classical.choice, Quot.sound\]" axioms.txt)" -eq 15
          ! grep -q sorryAx axioms.txt
